<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 32" width="100%" height="32" fill="none">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #3fb950); }
      }
      @keyframes flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -24; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      .accent-bar {
        animation: pulseGlow 2s ease-in-out infinite 0.6s;
      }
      .stream-line {
        stroke-dasharray: 4 4;
        animation: flow 1.8s linear infinite;
      }
      .s1 { animation: twinkle 1.5s ease-in-out infinite 0.3s; }
      .s2 { animation: twinkle 1.5s ease-in-out infinite 0.6s; }
      .s3 { animation: twinkle 1.5s ease-in-out infinite 0.9s; }
      .s4 { animation: twinkle 1.5s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <!-- Accent Indicator (Green) -->
  <rect x="0" y="7" width="4" height="18" rx="2" fill="#3fb950" class="accent-bar" />
  
  <!-- Title -->
  <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">VISION</text>
  
  <!-- Animated Streaming Dashed Line -->
  <line x1="95" y1="16" x2="680" y2="16" stroke="#238636" stroke-width="1.2" class="stream-line" opacity="0.6" />
  
  <!-- Pixel Bar Graphic (Green + Twinkling) -->
  <g transform="translate(695, 9)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#3fb950" class="s1" />
    <rect x="18" y="0" width="14" height="14" rx="2" fill="#238636" class="s2" />
    <rect x="36" y="0" width="14" height="14" rx="2" fill="#161b22" />
    <rect x="54" y="0" width="14" height="14" rx="2" fill="#0e4429" />
    <rect x="72" y="0" width="14" height="14" rx="2" fill="#56d364" class="s3" />
    <rect x="90" y="0" width="14" height="14" rx="2" fill="#2ea043" class="s4" />
    <rect x="108" y="0" width="14" height="14" rx="2" fill="#161b22" />
    <rect x="126" y="0" width="14" height="14" rx="2" fill="#3fb950" class="s1" />
    <rect x="144" y="0" width="14" height="14" rx="2" fill="#238636" class="s3" />
  </g>
</svg>
