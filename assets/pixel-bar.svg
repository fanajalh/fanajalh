<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 18" width="320" height="18">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .p1 { animation: pulse 1.6s ease-in-out infinite 0.1s; }
      .p2 { animation: pulse 1.6s ease-in-out infinite 0.3s; }
      .p3 { animation: pulse 1.6s ease-in-out infinite 0.5s; }
      .p4 { animation: pulse 1.6s ease-in-out infinite 0.7s; }
      .p5 { animation: pulse 1.6s ease-in-out infinite 0.9s; }
      .p6 { animation: pulse 1.6s ease-in-out infinite 1.1s; }
      .p7 { animation: pulse 1.6s ease-in-out infinite 1.3s; }
    </style>
  </defs>
  <rect x="0" y="2" width="14" height="14" fill="#238636" rx="2" class="p1" />
  <rect x="18" y="2" width="14" height="14" fill="#3fb950" rx="2" class="p2" />
  <rect x="36" y="2" width="14" height="14" fill="#161b22" rx="2" />
  <rect x="54" y="2" width="14" height="14" fill="#2ea043" rx="2" class="p3" />
  <rect x="72" y="2" width="14" height="14" fill="#0e4429" rx="2" />
  <rect x="90" y="2" width="14" height="14" fill="#3fb950" rx="2" class="p4" />
