  <rect x="126" y="2" width="14" height="14" fill="#56d364" rx="2" class="p5" />
  <rect x="144" y="2" width="14" height="14" fill="#238636" rx="2" class="p6" />
  <rect x="162" y="2" width="14" height="14" fill="#161b22" rx="2" />
  <rect x="180" y="2" width="24" height="14" fill="#e6edf3" rx="2" class="p7" />
  <rect x="208" y="2" width="14" height="14" fill="#3fb950" rx="2" class="p1" />
  <rect x="226" y="2" width="14" height="14" fill="#161b22" rx="2" />
